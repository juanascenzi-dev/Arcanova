openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: experiences
    description: Experience management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: List all experiences
      description: Returns experiences ordered by sort_order. Hidden experiences are included (clients should filter by visible).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
  /experiences/{id}:
    patch:
      operationId: updateExperience
      tags: [experiences]
      summary: Update an experience (admin only)
      description: Requires x-admin-token header matching the ADMIN_PIN environment variable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperienceBody"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized — missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experience not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    I18nText:
      type: object
      description: Per-language text values. Keys are language codes (en, es, it, fr, ...).
      additionalProperties:
        type: string
      example:
        en: "English text"
        es: "Texto en español"
    I18nList:
      type: object
      description: Per-language string arrays. Keys are language codes.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        en: ["Item 1", "Item 2"]
        es: ["Elemento 1", "Elemento 2"]
    Experience:
      type: object
      properties:
        id:
          type: string
          description: Stable semantic ID (e.g. 'yacht', 'atv')
        slug:
          type: string
          description: URL-friendly slug (e.g. 'premium-private-yacht')
        sortOrder:
          type: integer
          description: Display order (0-999)
        visible:
          type: boolean
          description: Whether experience is visible to public
        tagType:
          type: string
          enum: ['bestSeller', 'adventure', 'extreme', 'cultural', 'comfort', 'planB']
        category:
          type: array
          items:
            type: string
            enum: ['adventure', 'relax', 'cultural']
          description: One or more categories
        imageUrl:
          type: string
          format: uri
        fallbackEmoji:
          type: string
          description: Unicode emoji used if image fails to load
        price:
          type: integer
          minimum: 0
          description: Price in USD
        durationHours:
          type: string
          description: Duration string (e.g. '6-8', '3-4')
        title:
          $ref: "#/components/schemas/I18nText"
        desc:
          $ref: "#/components/schemas/I18nText"
        includes:
          $ref: "#/components/schemas/I18nList"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - sortOrder
        - visible
        - tagType
        - category
        - imageUrl
        - fallbackEmoji
        - price
        - durationHours
        - title
        - desc
        - includes
        - createdAt
        - updatedAt
    UpdateExperienceBody:
      type: object
      description: Fields to update on an experience. All fields are optional but validated when provided.
      properties:
        slug:
          type: string
          description: URL-friendly slug
        sortOrder:
          type: integer
          description: New display order
        visible:
          type: boolean
        tagType:
          type: string
          enum: ['bestSeller', 'adventure', 'extreme', 'cultural', 'comfort', 'planB']
        category:
          type: array
          items:
            type: string
            enum: ['adventure', 'relax', 'cultural']
        imageUrl:
          type: string
          format: uri
        fallbackEmoji:
          type: string
        price:
          type: integer
          minimum: 0
        durationHours:
          type: string
        title:
          $ref: "#/components/schemas/I18nText"
        desc:
          $ref: "#/components/schemas/I18nText"
        includes:
          $ref: "#/components/schemas/I18nList"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
      required:
        - error
        - details
