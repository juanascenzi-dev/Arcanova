openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: experiences
  - name: leads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: List all experiences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
  /experiences/{id}:
    patch:
      operationId: updateExperience
      tags: [experiences]
      summary: Update experience (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperienceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead (public)
      description: Capture user interest from an experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads (admin only)
      description: Retrieve all leads with optional filtering
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, closed, discarded]
        - name: channel
          in: query
          schema:
            type: string
            enum: [whatsapp, email, facebook]
        - name: experienceId
          in: query
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, es]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a single lead (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    Experience:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        visible:
          type: boolean
        tagType:
          type: string
        category:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        fallbackEmoji:
          type: string
        price:
          type: integer
        durationHours:
          type: string
        title:
          type: object
          additionalProperties:
            type: string
        desc:
          type: object
          additionalProperties:
            type: string
        includes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        bookingRules:
          type: object
          nullable: true
          properties:
            chargeMode:
              type: string
              enum: [per_person, per_group_fixed, per_day, per_person_per_day, per_group_per_day]
            minTravelers:
              type: integer
              nullable: true
            maxTravelers:
              type: integer
              nullable: true
            includedTravelers:
              type: integer
              nullable: true
            chargeFullIncludedGroup:
              type: boolean
              nullable: true
          required:
            - chargeMode
        servicePricing:
          type: object
          nullable: true
          properties:
            priceAdult:
              type: number
              nullable: true
            priceChild:
              type: number
              nullable: true
            priceSenior:
              type: number
              nullable: true
            priceGroup:
              type: number
              nullable: true
            priceDay:
              type: number
              nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - sortOrder
        - visible
        - tagType
        - category
        - imageUrl
        - fallbackEmoji
        - price
        - durationHours
        - title
        - desc
        - includes
        - createdAt
        - updatedAt

    UpdateExperienceBody:
      type: object

    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        experienceId:
          type: string
        experienceSlug:
          type: string
        experienceTitle:
          type: string
        channel:
          type: string
          enum: [whatsapp, email, facebook]
        lang:
          type: string
          enum: [en, es]
        tentativeDate:
          type: string
          nullable: true
        people:
          type: integer
          nullable: true
        messageSnapshot:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, contacted, closed, discarded]
      required:
        - id
        - createdAt
        - updatedAt
        - experienceId
        - experienceSlug
        - experienceTitle
        - channel
        - lang
        - status

    CreateLeadBody:
      type: object
      properties:
        experienceId:
          type: string
        experienceSlug:
          type: string
        experienceTitle:
          type: string
        channel:
          type: string
          enum: [whatsapp, email, facebook]
        lang:
          type: string
          enum: [en, es]
        tentativeDate:
          type: string
          nullable: true
        people:
          type: integer
          nullable: true
        messageSnapshot:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
      required:
        - experienceId
        - experienceSlug
        - experienceTitle
        - channel
        - lang

    UpdateLeadBody:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, closed, discarded]
        messageSnapshot:
          type: string
