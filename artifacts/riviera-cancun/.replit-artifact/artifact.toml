kind = "web"
previewPath = "/"
title = "Riviera Cancún Premium"
version = "1.0.0"
id = "artifacts/riviera-cancun"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21880
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/riviera-cancun run dev"

[services.env]
PORT = "21880"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/riviera-cancun", "run", "build"]
publicDir = "artifacts/riviera-cancun/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
